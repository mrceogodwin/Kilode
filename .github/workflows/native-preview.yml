name: Kilode native validation

on:
  push:
    branches:
      - preview/web
  pull_request:
    branches:
      - preview/web
  workflow_dispatch:

concurrency:
  group: kilode-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout native app
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Export iOS JavaScript bundle
        run: |
          npx expo export --platform ios
          mv dist artifacts-ios

      - name: Export visual web preview from the same React Native screens
        run: |
          npx expo export --platform web
          mv dist artifacts-web

      - name: Save validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kilode-native-preview-${{ github.sha }}
          path: |
            artifacts-ios/
            artifacts-web/
          if-no-files-found: error
          retention-days: 14
