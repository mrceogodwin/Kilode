name: Kilode iOS Preview Build

on:
  workflow_dispatch:
  push:
    branches:
      - preview/web
    paths:
      - "App.tsx"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "screens/**"
      - "components/**"
      - "lib/**"
      - "supabase/**"
      - ".github/workflows/kilode-ios-preview.yml"

permissions:
  contents: read

concurrency:
  group: kilode-ios-preview
  cancel-in-progress: false

jobs:
  ios-preview:
    name: Validate and build native iOS preview
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - name: Check out the requested branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Validate EAS credentials without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EXPO_TOKEN}" ]]; then
            echo "::error::Missing EXPO_TOKEN repository secret. Add it in GitHub Actions secrets before running the iOS build."
            exit 1
          fi
          if [[ -z "${EAS_PROJECT_ID}" ]]; then
            echo "::error::Missing EAS_PROJECT_ID repository secret. Add it in GitHub Actions secrets before running the iOS build."
            exit 1
          fi
          APP_PROJECT_ID="$(node -p "require('./app.json').expo.extra.eas.projectId || ''")"
          if [[ -z "${APP_PROJECT_ID}" ]]; then
            echo "::error::app.json is missing expo.extra.eas.projectId."
            exit 1
          fi
          if [[ "${APP_PROJECT_ID}" != "${EAS_PROJECT_ID}" ]]; then
            echo "::error::EAS_PROJECT_ID secret does not match app.json. Update the correct value; secret values are not printed."
            exit 1
          fi
          echo "EAS credentials are present and project IDs match."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check Expo configuration and native dependencies
        run: npx expo-doctor

      - name: Build iOS internal preview on EAS
        run: npx eas-cli build --platform ios --profile preview --non-interactive
