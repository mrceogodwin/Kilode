<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Kilode · Native preview (reflects mrceogodwin/Kilode)</title>
<style>
  :root{
    --bg:#0A0A0A;--card:#141414;--elev:#1A1A1A;--border:#2A2A2A;
    --text:#F5F5F5;--text2:#A3A3A3;--text3:#737373;
    --accent:#22C55E;--accentSoft:#0F2A1A;--danger:#F43F5E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:#111;color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  h1{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:8px;text-align:center}
  .note{font-size:11px;color:var(--text3);max-width:390px;text-align:center;margin-bottom:14px;line-height:1.4}
  .badge{display:inline-block;background:var(--accentSoft);color:var(--accent);border:1px solid #1A3D28;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;margin-bottom:12px}
  .phone{width:min(390px,100%);height:min(780px,92vh);background:var(--bg);border-radius:40px;border:8px solid #1c1c1e;box-shadow:0 20px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;position:relative}
  .notch{height:28px;display:flex;align-items:center;justify-content:center}
  .notch span{width:100px;height:22px;background:#000;border-radius:12px}
  .status{height:18px;padding:0 20px;display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--text)}
  .header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border)}
  .brand{font-size:19px;font-weight:800;letter-spacing:-.4px}
  .brand em{color:var(--accent);font-style:normal}
  .hdr-right{display:flex;gap:8px;align-items:center}
  .pill{font-size:10px;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--text2)}
  .av{width:32px;height:32px;border-radius:16px;background:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
  .pad{padding:12px 16px}
  .h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
  .sub{font-size:13px;color:var(--text2);margin-top:2px}
  .carousel{display:flex;gap:12px;padding:0 14px;overflow-x:auto;scroll-snap-type:x mandatory}
  .slide{min-width:280px;height:130px;border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;scroll-snap-align:start}
  .slide b{font-size:17px}
  .slide span{font-size:12px;opacity:.9;margin-top:4px}
  .chips{display:flex;gap:8px;padding:12px 14px;overflow-x:auto}
  .chip{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap;cursor:pointer}
  .chip.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}
  .sec{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px}
  .sec h3{font-size:16px;font-weight:700}
  .sec a{font-size:13px;color:var(--accent);font-weight:600;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px}
  .cell{aspect-ratio:1;background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--text2);cursor:pointer}
  .cell span{font-size:22px}
  .card{margin:0 14px 10px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:14px}
  .row{display:flex;gap:10px;align-items:center}
  .meta{font-size:12px;color:var(--text3)}
  .name{font-size:14px;font-weight:700}
  .body{font-size:14px;line-height:1.4;margin:8px 0;color:var(--text)}
  .media{height:150px;border-radius:12px;margin:8px 0}
  .fact{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:11px;font-weight:700}
  .bar{flex:1;height:6px;border-radius:3px;background:var(--elev);display:flex;overflow:hidden}
  .bar i:first-child{background:var(--accent)}
  .bar i:last-child{background:var(--danger)}
  .actions{display:flex;gap:16px;font-size:13px;color:var(--text2);font-weight:600}
  .composer{margin:10px 14px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;display:flex;gap:10px;align-items:center}
  .composer input{flex:1;background:transparent;border:0;color:var(--text);font-size:14px;outline:none}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:12px;cursor:pointer}
  .dock{display:flex;align-items:center;justify-content:space-around;padding:8px 6px 16px;border-top:1px solid var(--border);background:var(--bg)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px;color:var(--text3);font-size:10px;font-weight:600;cursor:pointer;background:none;border:0}
  .tab.on{color:var(--accent)}
  .plus{width:48px;height:48px;border-radius:24px;background:var(--accent);color:#fff;font-size:28px;display:grid;place-items:center;margin-top:-16px;border:3px solid var(--bg);cursor:pointer}
  .desk{text-align:center;padding:32px 20px}
  .desk .ico{font-size:40px;margin-bottom:8px}
  .list{margin:0 14px}
  .toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#27272A;padding:10px 16px;border-radius:999px;font-size:12px;font-weight:600;opacity:0;transition:.2s}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <div class="badge">PREVIEW · mirrors Kilode Expo app structure · seed data labeled</div>
  <h1>Kilode iOS visual preview</h1>
  <p class="note">Not Expo runtime — interactive HTML reflecting <b>mrceogodwin/Kilode</b> dark + green identity, Home / Socials / Activity / My Space / desks. Open on phone for best feel.</p>

  <div class="phone" id="phone">
    <div class="notch"><span></span></div>
    <div class="status"><span>9:41</span><span>Kilode</span><span>100%</span></div>
    <div class="header">
      <div class="brand" id="hdrTitle">Kilode<em>!</em></div>
      <div class="hdr-right">
        <span class="pill">seed</span>
        <div class="av" onclick="go('myspace')">G</div>
      </div>
    </div>
    <div class="content" id="content"></div>
    <div class="dock">
      <button class="tab on" data-tab="home" onclick="go('home')">🏠<span>Home</span></button>
      <button class="tab" data-tab="socials" onclick="go('socials')">👥<span>Socials</span></button>
      <div class="plus" onclick="toast('Create sheet')">+</div>
      <button class="tab" data-tab="activity" onclick="go('activity')">🔔<span>Activity</span></button>
      <button class="tab" data-tab="myspace" onclick="go('myspace')">👤<span>My Space</span></button>
    </div>
    <div class="toast" id="toast"></div>
  </div>

<script>
const DESKS=[
  {id:'media',icon:'📰',label:'Media',blurb:'News & stories'},
  {id:'music',icon:'🎵',label:'Music',blurb:'Tracks & artists'},
  {id:'events',icon:'🎟️',label:'Events',blurb:'Tickets & nights'},
  {id:'market',icon:'🛒',label:'Market',blurb:'Shop discovery'},
  {id:'jobs',icon:'💼',label:'Jobs',blurb:'Opportunities'},
  {id:'communities',icon:'💬',label:'Communities',blurb:'Interest groups'},
  {id:'cinema',icon:'🎬',label:'Cinema',blurb:'Film & watch'},
  {id:'creators',icon:'✨',label:'Creators',blurb:'Creator profiles'},
];
const TAKES=[
  {name:'Ada N.',handle:'ada',text:'Lagos traffic is a full-time job. Who is winning today?',fact:62,likes:128,comments:24},
  {name:'Kemi',handle:'kemi',text:'New Afrobeats drop this weekend — save your energy.',fact:71,likes:402,comments:56},
];
const NEWS=[
  {kicker:'Politics',title:'Assembly debates fuel subsidy timeline',tone:'#1e3a2f'},
  {kicker:'Tech',title:'Lagos startups raise quieter rounds in Q3',tone:'#1a2744'},
];

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}

function go(tab){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const title=document.getElementById('hdrTitle');
  if(tab==='home') title.innerHTML='Kilode<em>!</em>';
  else if(tab==='socials') title.textContent='Socials';
  else if(tab==='activity') title.textContent='Notifications';
  else if(tab==='myspace') title.textContent='My Space';
  else title.textContent=DESKS.find(d=>d.id===tab)?.label||tab;
  const c=document.getElementById('content');
  if(tab==='home') c.innerHTML=homeHTML();
  else if(tab==='socials') c.innerHTML=socialsHTML();
  else if(tab==='activity') c.innerHTML=activityHTML();
  else if(tab==='myspace') c.innerHTML=myspaceHTML();
  else c.innerHTML=deskHTML(tab);
}

function homeHTML(){
  return `
  <div class="pad"><div class="h1">Good morning</div><div class="sub">@guest · member · seed data</div></div>
  <div class="carousel">
    <div class="slide" style="background:linear-gradient(135deg,#14532d,#22c55e)"><b>Tonight in Lagos</b><span>Rooms · live debates</span></div>
    <div class="slide" style="background:linear-gradient(135deg,#1e3a8a,#3b82f6)"><b>Afrobeats week</b><span>New drops on Music</span></div>
  </div>
  <div class="chips">
    <div class="chip on">For you</div><div class="chip">Trending</div><div class="chip">Rooms</div><div class="chip">News</div>
  </div>
  <div class="sec"><h3>Explore</h3><a onclick="toast('More desks')">More</a></div>
  <div class="grid">${DESKS.map(d=>`<div class="cell" onclick="go('${d.id}')"><span>${d.icon}</span>${d.label}</div>`).join('')}</div>
  <div class="sec"><h3>News for you</h3></div>
  ${NEWS.map(n=>`<div class="card row"><div class="media" style="width:64px;height:64px;margin:0;background:${n.tone}"></div><div><div class="meta" style="color:var(--accent)">${n.kicker}</div><div class="name">${n.title}</div></div></div>`).join('')}
  <div class="sec"><h3>Trending takes</h3><a onclick="go('socials')">Socials</a></div>
  ${TAKES.map(t=>`<div class="card"><div class="row"><div class="av">${t.name[0]}</div><div><div class="name">${t.name}</div><div class="meta">@${t.handle}</div></div></div><div class="body">${t.text}</div><div class="fact"><span style="color:var(--accent)">FACT ${t.fact}%</span><div class="bar"><i style="flex:${t.fact}"></i><i style="flex:${100-t.fact}"></i></div><span style="color:var(--danger)">CAP ${100-t.fact}%</span></div></div>`).join('')}
  `;
}
function socialsHTML(){
  return `
  <div class="composer"><div class="av">G</div><input placeholder="What is happening in Naija?" readonly/><button class="btn" onclick="toast('Compose · native Modal')">Post</button></div>
  ${TAKES.map(t=>`<div class="card">
    <div class="row"><div class="av">${t.name[0]}</div><div style="flex:1"><div class="name">${t.name}</div><div class="meta">@${t.handle} · seed</div></div>
    <button class="btn" style="background:transparent;color:var(--accent);border:1px solid var(--accent)" onclick="toast('Follow')">Follow</button></div>
    <div class="body">${t.text}</div>
    <div class="media" style="background:linear-gradient(120deg,#14532d,#052e16)"></div>
    <div class="fact"><span style="color:var(--accent)">FACT ${t.fact}%</span><div class="bar"><i style="flex:${t.fact}"></i><i style="flex:${100-t.fact}"></i></div><span style="color:var(--danger)">CAP ${100-t.fact}%</span></div>
    <div class="actions"><span>♡ ${t.likes}</span><span>💬 ${t.comments}</span><span>Share</span></div>
  </div>`).join('')}`;
}
function activityHTML(){
  return `<div class="pad"><div class="h1">Notifications</div><div class="sub">Seed activity</div></div>
  ${['Someone liked your take','New follower · @kemi','Room started: Tech Lagos'].map((t,i)=>`<div class="card row"><div class="av">${['💚','👤','🎙️'][i]}</div><div style="flex:1"><div class="body" style="margin:0">${t}</div><div class="meta">${i+1}h ago</div></div></div>`).join('')}`;
}
function myspaceHTML(){
  return `<div class="desk"><div class="av" style="width:72px;height:72px;border-radius:36px;margin:0 auto 10px;font-size:24px">G</div>
  <div class="h1">Guest</div><div class="sub">@guest · member</div>
  <div style="display:flex;justify-content:center;gap:28px;margin:16px 0"><div><b>2</b><div class="meta">Takes</div></div><div><b>0</b><div class="meta">Following</div></div><div><b>0</b><div class="meta">Followers</div></div>
  <button class="btn" style="padding:12px 28px;border-radius:12px" onclick="toast('Edit profile')">Edit profile</button></div>
  <div class="sec"><h3>Wallet</h3></div><div class="card row"><div style="flex:1"><div class="name">₦0.00</div><div class="meta">Seed · backend when live</div></div><button class="btn" onclick="toast('Top up')">Top up</button></div>`;
}
function deskHTML(id){
  const d=DESKS.find(x=>x.id===id)||{label:id,icon:'📦',blurb:''};
  return `<div class="desk"><div class="ico">${d.icon}</div><div class="h1">${d.label}</div><div class="sub">${d.blurb}</div>
  <button class="btn" style="margin-top:16px;padding:12px 24px;border-radius:12px" onclick="toast('Create in ${d.label}')">Create</button></div>
  <div class="sec"><h3>Listings · seed</h3></div>
  <div class="list"><div class="card"><div class="name">Sample ${d.label} item</div><div class="meta">Fixture until API is live</div></div></div>
  <div style="text-align:center;padding:12px"><a style="color:var(--accent);font-weight:600;cursor:pointer" onclick="go('home')">Back home</a></div>`;
}
go('home');
</script>
</body>
</html>
